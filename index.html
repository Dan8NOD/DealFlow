<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DealFlow — NOD-ify Sales Pipeline</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #12161e;
  --surface-2: #1a1f2b;
  --border: #2a3140;
  --border-hi: #3a4456;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --text-mid: #6e7681;
  --gold: #d4a853;
  --gold-glow: rgba(212,168,83,0.25);
  --green: #3fb950;
  --green-glow: rgba(63,185,80,0.2);
  --red: #f85149;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --radius: 10px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
[data-theme="light"] {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface-2: #f0eee8;
  --border: #d8d4cc;
  --border-hi: #c0bbb0;
  --text: #2a2520;
  --text-dim: #6b655c;
  --text-mid: #999189;
  --gold: #8a6d2a;
  --gold-glow: rgba(138,109,42,0.18);
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── Header ─── */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.logo {
  font-size: 18px; font-weight: 800; color: var(--gold);
  letter-spacing: 1px; text-shadow: 0 0 16px var(--gold-glow);
}
.logo span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
.spacer { flex: 1; }
.add-btn {
  background: var(--gold); color: var(--bg); border: none;
  padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px;
  cursor: pointer; transition: box-shadow 0.15s;
}
.add-btn:hover { box-shadow: 0 0 20px var(--gold-glow); }
.theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim); width: 36px; height: 36px;
  border-radius: 50%; cursor: pointer; font-size: 16px;
  display: grid; place-items: center; transition: border-color 0.15s;
}
.theme-toggle:hover { border-color: var(--gold); color: var(--gold); }

/* ─── Stats bar ─── */
.stats-bar {
  display: flex; gap: 24px; padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
}
.stats-bar strong { color: var(--gold); font-weight: 700; }
.stats-bar .stat-mrr strong { color: var(--green); }

/* ─── Filters ─── */
.filters {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 24px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim); font-size: 12px;
  cursor: pointer; transition: all 0.1s;
}
.filter-btn:hover { background: var(--surface-2); color: var(--text); }
.filter-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }

/* ─── Board ─── */
.board {
  display: flex; gap: 12px;
  padding: 16px 24px;
  overflow-x: auto;
  min-height: calc(100vh - 130px);
}
.column {
  flex: 1; min-width: 280px; max-width: 360px;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.column-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.column-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.column-count {
  margin-left: auto; font-size: 12px; font-weight: 600;
  color: var(--text-dim); background: var(--bg);
  padding: 2px 10px; border-radius: 999px;
}
.column-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 100px; }
.column-footer {
  padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-mid); text-align: center;
}

/* ─── Deal card ─── */
.deal-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: grab;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.deal-card:hover { border-color: var(--gold); box-shadow: 0 4px 12px var(--gold-glow); }
.deal-card.dragging { opacity: 0.5; cursor: grabbing; }
.deal-card .deal-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.deal-card .deal-price { font-size: 18px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
.deal-card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.deal-card .tag {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 8px; border-radius: 4px;
  background: var(--bg); color: var(--text-dim); border: 1px solid var(--border);
}
.deal-card .tag.digital { color: var(--blue); border-color: var(--blue); }
.deal-card .tag.subscription { color: var(--green); border-color: var(--green); }
.deal-card .tag.service { color: var(--purple); border-color: var(--purple); }
.deal-card .tag.source { color: var(--text-dim); }
.deal-card .notes { font-size: 11px; color: var(--text-mid); font-style: italic; margin-top: 6px; line-height: 1.4; }
.deal-card .deal-link { font-size: 11px; margin-top: 6px; }
.deal-card .deal-link a { color: var(--gold); text-decoration: none; }
.deal-card .deal-link a:hover { text-decoration: underline; }

/* ─── Empty ─── */
.empty-col { text-align: center; padding: 40px 16px; color: var(--text-mid); font-size: 12px; }

/* ─── Add deal modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; place-items: center; z-index: 20;
}
.modal-overlay.open { display: grid; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  width: 90%; max-width: 420px; box-shadow: var(--shadow);
}
.modal h2 { font-size: 16px; color: var(--gold); margin-bottom: 16px; }
.modal label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit;
}
.modal textarea { resize: vertical; min-height: 50px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.modal .btn-ghost { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.modal .btn-primary { background: var(--gold); color: var(--bg); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px; }

/* ─── Mobile ─── */
@media (max-width: 768px) {
  .board { padding: 10px; }
  .column { min-width: 240px; }
  header { padding: 10px 14px; }
  .filters { padding: 8px 14px; }
  .stats-bar { padding: 8px 14px; gap: 14px; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .deal-card { transition: none; }
  .deal-card:hover { box-shadow: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">DEALFLOW <span>NOD-ify Sales Pipeline</span></div>
  <div class="spacer"></div>
  <button class="add-btn" onclick="openAddModal()">+ Add Deal</button>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
</header>

<div class="stats-bar" id="statsBar">
  <span><strong id="statTotal">0</strong> deals</span>
  <span><strong id="statValue">$0</strong> pipeline value</span>
  <span><strong id="statRevenue">$0</strong> closed revenue</span>
  <span class="stat-mrr"><strong id="statMRR">$0</strong> MRR (subscriptions)</span>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterDeals('all', this)">All</button>
  <button class="filter-btn" onclick="filterDeals('digital', this)">Digital</button>
  <button class="filter-btn" onclick="filterDeals('subscription', this)">Subscriptions</button>
  <button class="filter-btn" onclick="filterDeals('service', this)">Services</button>
</div>

<div class="board" id="board"></div>

<!-- Add deal modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Add New Deal</h2>
    <label>Name</label>
    <input id="newName" placeholder="e.g. $5/mo App Subscription">
    <label>Price ($)</label>
    <input id="newPrice" type="number" placeholder="5" min="0">
    <label>Type</label>
    <select id="newType">
      <option value="digital">Digital product</option>
      <option value="subscription">Subscription</option>
      <option value="service">Service / coaching</option>
    </select>
    <label>Source</label>
    <input id="newSource" placeholder="Gumroad, Stripe, Calendly, Email">
    <label>URL (optional)</label>
    <input id="newUrl" placeholder="https://...">
    <label>Notes</label>
    <textarea id="newNotes" placeholder="Any context about this deal"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn-primary" onclick="addDeal()">Add</button>
    </div>
  </div>
</div>

<script>
// ─── Pipeline stages ──────────────────────────────────────────
const STAGES = [
  { key: 'PIPELINE',     label: 'Pipeline',     dot: 'var(--gold)',   desc: 'Available to sell' },
  { key: 'NEGOTIATION',  label: 'Negotiation',  dot: 'var(--purple)', desc: 'In conversation' },
  { key: 'CLOSED',       label: 'Closed',        dot: 'var(--green)',  desc: 'Sold and paid' },
];

// ─── State ─────────────────────────────────────────────────────
const STORE_KEY = 'dealflow_deals_v1';
let allDeals = [];
let activeFilter = 'all';

// ─── Theme ────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const isDark = !root.getAttribute('data-theme');
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('dealflow-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '☀️' : '🌙';
}
(function initTheme() {
  const saved = localStorage.getItem('dealflow-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('.theme-toggle').textContent = '☀️';
  }
})();

// ─── Data ─────────────────────────────────────────────────────
async function loadDeals() {
  // Try Supabase first (when configured)
  try {
    if (window._supabase && window._authUser) {
      const { data, error } = await _supabase.from('pipeline_deals').select('*').order('created_at', { ascending: false });
      if (!error && data && data.length) { allDeals = data; return; }
    }
  } catch(e) { /* fall through */ }
  // Local: localStorage first, then seed from JSON
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) { allDeals = JSON.parse(saved); return; }
  } catch(e) {}
  try {
    const resp = await fetch('deals_data.json');
    allDeals = await resp.json();
    saveLocal();
  } catch(e) {
    allDeals = [];
  }
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(allDeals)); } catch(e) {}
}

// ─── Rendering ────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  const filtered = activeFilter === 'all'
    ? allDeals
    : allDeals.filter(d => d.type === activeFilter);

  board.innerHTML = STAGES.map(stage => {
    const deals = filtered.filter(d => (d.stage || 'PIPELINE') === stage.key);
    return `
      <div class="column" data-stage="${stage.key}">
        <div class="column-header">
          <span class="column-dot" style="background:${stage.dot};box-shadow:0 0 10px ${stage.dot};"></span>
          <span class="column-title">${stage.label}</span>
          <span class="column-count">${deals.length}</span>
        </div>
        <div class="column-body" id="col-${stage.key}">
          ${deals.length === 0 ? '<div class="empty-col">No deals here</div>' : deals.map(renderCard).join('')}
        </div>
        <div class="column-footer">${stage.desc}</div>
      </div>
    `;
  }).join('');

  updateStats();
  attachDragHandlers();
}

function renderCard(deal) {
  const fmt = v => v >= 1000 ? '$' + (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'K' : '$' + v;
  const recurring = deal.type === 'subscription' ? '/mo' : '';
  return `
    <div class="deal-card" draggable="true" data-id="${escapeAttr(deal.id)}" data-stage="${deal.stage || 'PIPELINE'}">
      <div class="deal-name">${escapeHtml(deal.name)}</div>
      <div class="deal-price">${fmt(deal.price || 0)}${recurring}</div>
      <div class="meta">
        <span class="tag ${deal.type}">${deal.type || 'digital'}</span>
        ${deal.source ? '<span class="tag source">' + escapeHtml(deal.source) + '</span>' : ''}
      </div>
      ${deal.notes ? '<div class="notes">' + escapeHtml(deal.notes) + '</div>' : ''}
      ${deal.url ? '<div class="deal-link"><a href="' + escapeAttr(deal.url) + '" target="_blank" rel="noopener">Open →</a></div>' : ''}
    </div>
  `;
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

// ─── Stats ────────────────────────────────────────────────────
function updateStats() {
  const pipeline = allDeals.filter(d => (d.stage || 'PIPELINE') !== 'CLOSED');
  const closed = allDeals.filter(d => d.stage === 'CLOSED');
  const subs = allDeals.filter(d => d.type === 'subscription' && d.stage === 'CLOSED');
  document.getElementById('statTotal').textContent = allDeals.length;
  document.getElementById('statValue').textContent = fmtMoney(pipeline.reduce((s, d) => s + (d.price || 0), 0));
  document.getElementById('statRevenue').textContent = fmtMoney(closed.reduce((s, d) => s + (d.price || 0), 0));
  document.getElementById('statMRR').textContent = fmtMoney(subs.reduce((s, d) => s + (d.price || 0), 0));
}
function fmtMoney(v) { return v >= 1000 ? '$' + (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'K' : '$' + v; }

// ─── Filtering ────────────────────────────────────────────────
function filterDeals(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderBoard();
}

// ─── Drag and drop ────────────────────────────────────────────
let dragId = null, dragStage = null;
function attachDragHandlers() {
  document.querySelectorAll('.deal-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragId = card.dataset.id;
      dragStage = card.dataset.stage;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.column-body').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    col.addEventListener('drop', e => {
      e.preventDefault();
      const newStage = col.parentElement.dataset.stage;
      if (dragId && newStage && newStage !== dragStage) {
        const deal = allDeals.find(d => String(d.id) === dragId);
        if (deal) {
          deal.stage = newStage;
          saveLocal();
          if (window._supabase && window._authUser && deal.id) {
            _supabase.from('pipeline_deals').update({ stage: newStage }).eq('id', deal.id).then(() => {});
          }
          renderBoard();
        }
      }
      dragId = null; dragStage = null;
    });
  });
}

// ─── Add deal modal ───────────────────────────────────────────
function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
  ['newName','newPrice','newSource','newUrl','newNotes'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('newType').value = 'digital';
}
function addDeal() {
  const name = document.getElementById('newName').value.trim();
  const price = parseFloat(document.getElementById('newPrice').value) || 0;
  const type = document.getElementById('newType').value;
  const source = document.getElementById('newSource').value.trim();
  const url = document.getElementById('newUrl').value.trim();
  const notes = document.getElementById('newNotes').value.trim();
  if (!name) { alert('Deal name is required'); return; }
  const deal = {
    id: 'deal-' + Date.now(),
    name, price, type, source, url, notes,
    stage: 'PIPELINE',
    created_at: new Date().toISOString(),
  };
  allDeals.unshift(deal);
  saveLocal();
  if (window._supabase && window._authUser) {
    _supabase.from('pipeline_deals').insert(deal).then(() => {});
  }
  closeAddModal();
  renderBoard();
}

// ─── Init ────────────────────────────────────────────────────
loadDeals().then(renderBoard);
</script>
</body>
</html>
