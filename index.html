<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DealFlow — FatCat Pipeline</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #12161e;
  --surface-2: #1a1f2b;
  --border: #2a3140;
  --border-hi: #3a4456;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --text-mid: #6e7681;
  --gold: #d4a853;
  --gold-glow: rgba(212,168,83,0.25);
  --green: #3fb950;
  --green-glow: rgba(63,185,80,0.2);
  --red: #f85149;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --yellow: #d29922;
  --radius: 10px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
[data-theme="light"] {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface-2: #f0eee8;
  --border: #d8d4cc;
  --border-hi: #c0bbb0;
  --text: #2a2520;
  --text-dim: #6b655c;
  --text-mid: #999189;
  --gold: #8a6d2a;
  --gold-glow: rgba(138,109,42,0.18);
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── Header ─── */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.logo {
  font-size: 18px; font-weight: 800; color: var(--gold);
  letter-spacing: 1px; text-shadow: 0 0 16px var(--gold-glow);
}
.logo span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
.spacer { flex: 1; }
.theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim); width: 36px; height: 36px;
  border-radius: 50%; cursor: pointer; font-size: 16px;
  display: grid; place-items: center; transition: border-color 0.15s;
}
.theme-toggle:hover { border-color: var(--gold); color: var(--gold); }

/* ─── Pipeline board ─── */
.board {
  display: flex; gap: 12px;
  padding: 16px 24px;
  overflow-x: auto;
  min-height: calc(100vh - 60px);
}
.column {
  flex: 1; min-width: 280px; max-width: 360px;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.column-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.column-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.column-count {
  margin-left: auto; font-size: 12px; font-weight: 600;
  color: var(--text-dim); background: var(--bg);
  padding: 2px 10px; border-radius: 999px;
}
.column-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.column-footer {
  padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-mid); text-align: center;
}

/* ─── Deal card ─── */
.deal-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: grab;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.deal-card:hover { border-color: var(--gold); box-shadow: 0 4px 12px var(--gold-glow); }
.deal-card.dragging { opacity: 0.5; cursor: grabbing; }
.deal-card .addr { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.deal-card .addr .unit { color: var(--gold); font-size: 12px; margin-left: 6px; }
.deal-card .price { font-size: 15px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
.deal-card .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.deal-card .tag {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 8px; border-radius: 4px;
  background: var(--bg); color: var(--text-dim); border: 1px solid var(--border);
}
.deal-card .tag.rental { color: var(--blue); border-color: var(--blue); }
.deal-card .tag.sale { color: var(--purple); border-color: var(--purple); }
.deal-card .tag.hold { color: var(--red); border-color: var(--red); }
.deal-card .tag.closed { color: var(--green); border-color: var(--green); }
.deal-card .notes { font-size: 11px; color: var(--text-mid); font-style: italic; margin-top: 4px; line-height: 1.4; }
.deal-card .stat-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

/* ─── Empty state ─── */
.empty-col { text-align: center; padding: 40px 16px; color: var(--text-mid); font-size: 12px; }

/* ─── Filters ─── */
.filters {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 24px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim); font-size: 12px;
  cursor: pointer; transition: all 0.1s;
}
.filter-btn:hover { background: var(--surface-2); color: var(--text); }
.filter-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }

/* ─── Stats bar ─── */
.stats-bar {
  display: flex; gap: 24px; padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
}
.stats-bar strong { color: var(--gold); font-weight: 700; }

/* ─── Mobile ─── */
@media (max-width: 768px) {
  .board { padding: 10px; }
  .column { min-width: 240px; }
  header { padding: 10px 14px; }
  .filters { padding: 8px 14px; }
  .stats-bar { padding: 8px 14px; gap: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .deal-card { transition: none; }
  .deal-card:hover { box-shadow: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">DEALFLOW <span>FatCat Pipeline</span></div>
  <div class="spacer"></div>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
</header>

<div class="stats-bar" id="statsBar">
  <span><strong id="statTotal">0</strong> deals</span>
  <span><strong id="statValue">$0</strong> total pipeline value</span>
  <span><strong id="statRentals">0</strong> rentals</span>
  <span><strong id="statSales">0</strong> sales</span>
  <span><strong id="statClosed">0</strong> closed</span>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterDeals('all', this)">All</button>
  <button class="filter-btn" onclick="filterDeals('RENTALS', this)">Rentals</button>
  <button class="filter-btn" onclick="filterDeals('SALES', this)">Sales</button>
  <button class="filter-btn" onclick="filterDeals('HOLD', this)">On Hold</button>
  <button class="filter-btn" onclick="filterDeals('CLOSED', this)">Closed</button>
</div>

<div class="board" id="board">
  <!-- Columns rendered by JS -->
</div>

<script>
// ─── Pipeline stages ──────────────────────────────────────────
const STAGES = [
  { key: 'PIPELINE',   label: 'Pipeline',    dot: 'var(--gold)',   desc: 'Active listings & leads' },
  { key: 'SHOWING',    label: 'Showing',     dot: 'var(--blue)',   desc: 'Tours booked, CMAs in review' },
  { key: 'NEGOTIATION',label: 'Negotiation', dot: 'var(--purple)', desc: 'Offers, approvals, applicants' },
  { key: 'CLOSED',     label: 'Closed',      dot: 'var(--green)',  desc: 'Signed, paid, done' },
];

// Map old spreadsheet statuses to pipeline stages
const STATUS_TO_STAGE = {
  'EXECUTE':           'PIPELINE',
  'LIVE':              'PIPELINE',
  'Load Pics':         'PIPELINE',
  'Get Listing Agmt':  'PIPELINE',
  'YouTube/FB':        'PIPELINE',
  '':                  'PIPELINE',
  'CMA':               'SHOWING',
  'FOR APPROVAL':      'NEGOTIATION',
  'APPROVED APPLICANT':'NEGOTIATION',
  'FINISHED':          'CLOSED',
};

// ─── State ─────────────────────────────────────────────────────
let allDeals = [];
let activeFilter = 'all';

// ─── Theme ────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const isDark = !root.getAttribute('data-theme');
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('dealflow-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '☀️' : '🌙';
}
(function initTheme() {
  const saved = localStorage.getItem('dealflow-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('.theme-toggle').textContent = '☀️';
  }
})();

// ─── Data loading ─────────────────────────────────────────────
async function loadDeals() {
  // Try Supabase first (when configured), fall back to local JSON
  try {
    if (window._supabase && window._authUser) {
      const { data, error } = await _supabase.from('pipeline_deals').select('*').order('created_at', { ascending: false });
      if (!error && data) { allDeals = data; return; }
    }
  } catch(e) { /* fall through to local */ }
  // Local fallback: load the spreadsheet JSON
  try {
    const resp = await fetch('deals_data.json');
    allDeals = await resp.json();
  } catch(e) {
    allDeals = [];
  }
}

// ─── Stage assignment ──────────────────────────────────────────
function dealStage(deal) {
  if (deal.stage) return deal.stage; // explicit stage from Supabase
  if (deal.section === 'CLOSED') return 'CLOSED';
  if (deal.section === 'HOLD' || deal.status === 'WAIT') return 'PIPELINE';
  const raw = deal.status || '';
  return STATUS_TO_STAGE[raw] || 'PIPELINE';
}

function dealValue(deal) {
  return deal.price || 0;
}

function dealType(deal) {
  if (deal.is_sale || deal.section === 'SALES') return 'sale';
  if (deal.section === 'CLOSED') return 'closed';
  if (deal.section === 'HOLD' || deal.status === 'WAIT') return 'hold';
  return 'rental';
}

// ─── Rendering ────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  const filtered = activeFilter === 'all'
    ? allDeals
    : activeFilter === 'HOLD'
      ? allDeals.filter(d => dealType(d) === 'hold')
      : allDeals.filter(d => {
          const t = dealType(d);
          if (activeFilter === 'RENTALS') return t === 'rental';
          if (activeFilter === 'SALES') return t === 'sale';
          if (activeFilter === 'CLOSED') return t === 'closed';
          return true;
        });

  board.innerHTML = STAGES.map(stage => {
    const deals = filtered.filter(d => dealStage(d) === stage.key);
    return `
      <div class="column" data-stage="${stage.key}">
        <div class="column-header">
          <span class="column-dot" style="background:${stage.dot};box-shadow:0 0 10px ${stage.dot};"></span>
          <span class="column-title">${stage.label}</span>
          <span class="column-count">${deals.length}</span>
        </div>
        <div class="column-body" id="col-${stage.key}">
          ${deals.length === 0
            ? '<div class="empty-col">No deals in this stage</div>'
            : deals.map(d => renderCard(d)).join('')
          }
        </div>
        <div class="column-footer">${stage.desc}</div>
      </div>
    `;
  }).join('');

  updateStats(filtered);
  attachDragHandlers();
}

function renderCard(deal) {
  const type = dealType(deal);
  const value = dealValue(deal);
  const fmt = v => v >= 1000 ? '$' + v.toLocaleString() : v ? '$' + v : '';
  return `
    <div class="deal-card" draggable="true" data-id="${deal.address + (deal.unit || '')}" data-stage="${dealStage(deal)}">
      <div class="addr">${escapeHtml(deal.address)}${deal.unit ? '<span class="unit">' + escapeHtml(deal.unit) + '</span>' : ''}</div>
      ${value ? '<div class="price">' + fmt(value) + '</div>' : ''}
      <div class="meta">
        <span class="tag ${type}">${type.toUpperCase()}</span>
        ${deal.beds ? '<span class="tag">' + escapeHtml(deal.beds) + '</span>' : ''}
        ${deal.available ? '<span class="tag">' + escapeHtml(String(deal.available)) + '</span>' : ''}
      </div>
      ${deal.lockbox ? '<div class="stat-row"><span>Lockbox</span><span>' + escapeHtml(deal.lockbox) + '</span></div>' : ''}
      ${deal.notes ? '<div class="notes">' + escapeHtml(deal.notes) + '</div>' : ''}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ─── Stats ────────────────────────────────────────────────────
function updateStats(deals) {
  document.getElementById('statTotal').textContent = deals.length;
  const totalValue = deals.reduce((s, d) => s + (dealValue(d) || 0), 0);
  document.getElementById('statValue').textContent = totalValue >= 1000
    ? '$' + (totalValue / 1000).toFixed(0) + 'K'
    : '$' + totalValue;
  document.getElementById('statRentals').textContent = deals.filter(d => dealType(d) === 'rental').length;
  document.getElementById('statSales').textContent = deals.filter(d => dealType(d) === 'sale').length;
  document.getElementById('statClosed').textContent = deals.filter(d => dealType(d) === 'closed').length;
}

// ─── Filtering ────────────────────────────────────────────────
function filterDeals(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderBoard();
}

// ─── Drag and drop ────────────────────────────────────────────
let dragId = null;
let dragStage = null;

function attachDragHandlers() {
  document.querySelectorAll('.deal-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragId = card.dataset.id;
      dragStage = card.dataset.stage;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
    });
  });
  document.querySelectorAll('.column-body').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      const newStage = col.parentElement.dataset.stage;
      if (dragId && newStage && newStage !== dragStage) {
        // Update local state
        const deal = allDeals.find(d => (d.address + (d.unit || '')) === dragId);
        if (deal) {
          deal.stage = newStage;
          deal.status = newStage === 'CLOSED' ? 'FINISHED' : deal.status;
          // Persist to Supabase if connected
          if (window._supabase && window._authUser && deal.id) {
            _supabase.from('pipeline_deals').update({ stage: newStage }).eq('id', deal.id).then(() => {});
          }
          renderBoard();
        }
      }
      dragId = null;
      dragStage = null;
    });
  });
}

// ─── Init ────────────────────────────────────────────────────
loadDeals().then(renderBoard);
</script>
</body>
</html>
